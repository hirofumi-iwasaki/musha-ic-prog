name: Publish macOS release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.4
  FLUTTER_REVISION: 9584c6713b324636289d067944a46fd6b49df14b

jobs:
  macos-arm64:
    name: Build and upload macOS Arm64 release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Bootstrap pinned native Flutter SDK
        run: bash tool/ci/bootstrap_flutter.sh arm64 "$RUNNER_TEMP/flutter"
      - name: Analyze and test shared Dart code
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build and package complete macOS bundle
        run: FLUTTER_BIN="$RUNNER_TEMP/flutter/bin/flutter" zsh tool/package_macos.sh
      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/musha-ic-prog-macos-arm64.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: musha-ic-prog-macos-arm64
          path: dist/musha-ic-prog-macos-arm64.zip
          if-no-files-found: error

# A published GitHub Release includes stable and pre-release publication.
# workflow_dispatch retains the ZIP as an Actions artifact without uploading it.
